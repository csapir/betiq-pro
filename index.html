<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportIQ Ultra Pro — Elite Analytics</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Heebo:wght@300;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body onload="app.init()">

<div class="app-shell">
    <aside class="sidebar">
        <div class="logo">S<span>IQ</span></div>
        <nav>
            <button onclick="app.changeSport('soccer')" id="btn-side-soccer" class="nav-btn active">⚽</button>
            <button onclick="app.changeSport('basketball')" id="btn-side-basketball" class="nav-btn">🏀</button>
        </nav>
    </aside>

    <main class="content-area">
        <header class="main-header">
            <div class="header-info">
                <h1 class="glitch">SportIQ <span>PREDICTOR</span></h1>
                <div class="status-row">
                    <span id="api-status" class="api-badge">SCANNING...</span>
                </div>
            </div>
            <div class="global-metrics">
                <div class="metric">Hot Games: <b id="hot-games-count">0</b></div>
                <div class="metric">AI Confidence: <b>89%</b></div>
            </div>
        </header>

        <div class="dashboard-grid">
            <section class="list-panel glass">
                <div class="panel-head">
                    <h3>LIVE FEED</h3>
                    <div class="live-dot"></div>
                </div>
                <div id="matches-container" class="scroll-list"></div>
            </section>

            <section class="analysis-panel glass">
                <div id="placeholder-text" class="placeholder">
                    <div class="ai-loader"></div>
                    <p>ממתין לבחירת אירוע לניתוח עומק...</p>
                </div>

                <div id="analysis-content" style="display:none;">
                    <div class="analysis-grid-top">
                        <div class="match-hero">
                            <h2 id="selected-match-title"></h2>
                            <div class="radar-box">
                                <canvas id="radarChart"></canvas>
                            </div>
                        </div>
                        
                        <div class="ai-summary-card">
                            <div class="verdict-header">🤖 AI INSIGHT</div>
                            <p id="ai-verdict-text"></p>
                            <div class="value-meter">
                                <label>Value Score</label>
                                <div class="meter-bar"><div id="value-fill" style="width: 0%"></div></div>
                            </div>
                        </div>
                    </div>

                    <div class="analysis-nav">
                        <button onclick="ui.switchTab('overview')" class="tab-btn active">סטטיסטיקה</button>
                        <button onclick="ui.switchTab('odds')" class="tab-btn">מחשבון VALUE</button>
                        <button onclick="ui.switchTab('momentum')" class="tab-btn">לחץ חי</button>
                    </div>

                    <div id="tab-overview" class="tab-content">
                        <div class="stats-grid" id="stats-grid"></div>
                    </div>

                    <div id="tab-odds" class="tab-content" style="display:none;">
                        <div class="odds-flex" id="odds-display"></div>
                    </div>

                    <div id="tab-momentum" class="tab-content" style="display:none;">
                        <div class="chart-container-large">
                            <canvas id="momentumChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="app.js"></script>
</body>
</html>
