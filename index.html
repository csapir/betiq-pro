<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportIQ Pro — Analysis & Data</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="setup-screen" class="modal">
    <div class="setup-box">
        <h2>🔑 הגדרת מסד נתונים</h2>
        <input type="password" id="oddsApiKey" placeholder="The Odds API Key">
        <input type="password" id="anthropicKey" placeholder="Claude API Key">
        <button class="primary-btn" onclick="app.start()">הפעל מערכת</button>
        <button class="secondary-btn" onclick="app.startDemo()">מצב תצוגה (Demo)</button>
    </div>
</div>

<header>
    <div class="logo">SPORT<span>IQ</span></div>
    <nav>
        <button onclick="ui.showSection('dashboard')" class="nav-link active">דשבורד</button>
        <button onclick="ui.showSection('tactical')" class="nav-link">ניתוח טקטי</button>
    </nav>
</header>

<main>
    <section id="dashboard" class="page active">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="label">דיוק מודל AI</span>
                <span class="value">74.2%</span>
            </div>
            <div class="stat-card">
                <span class="label">משחקים בניתוח</span>
                <span id="match-count" class="value">0</span>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h3>🏟️ לוח משחקים והסתברויות</h3>
                <div id="matches-container"></div>
            </div>

            <div class="panel">
                <h3>🧮 מנתח ערך (Value Finder)</h3>
                <div class="calc-tool">
                    <label>יחס שוק נוכחי:</label>
                    <input type="number" id="odds-input" step="0.01" oninput="logic.updateProb()">
                    <div id="prob-display" class="result">הסתברות גלומה: --%</div>
                    <p class="hint">אם ה-AI נותן הסתברות גבוהה מהערך הזה, יש כאן "ערך סטטיסטי".</p>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
