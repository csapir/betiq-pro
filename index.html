<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportIQ Pro — Analysis & Data Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="setup-screen" class="modal">
    <div class="setup-box">
        <h2 class="logo">SPORT<span>IQ</span></h2>
        <p>מערכת איסוף נתונים וניתוח AI</p>
        <input type="password" id="oddsApiKey" placeholder="The Odds API Key">
        <input type="password" id="anthropicKey" placeholder="Claude AI API Key">
        <button class="primary-btn" onclick="app.start()">הפעל מערכת אנליטית</button>
        <button class="secondary-btn" onclick="app.startDemo()">המשך במצב דמו (נתוני דוגמה)</button>
    </div>
</div>

<header>
    <div class="logo">SPORT<span>IQ</span></div>
    <nav>
        <button onclick="ui.showSection('dashboard')" class="nav-link active">מרכז נתונים</button>
        <button onclick="ui.showSection('alerts')" class="nav-link">🔔 התראות חמות</button>
    </nav>
    <div class="live-status"><span class="dot"></span> LIVE DATA FEED</div>
</header>

<main>
    <section id="dashboard" class="page active">
        <div class="filter-strip">
            <button id="btn-soccer" onclick="logic.filterSport('soccer')" class="sport-tab active">⚽ כדורגל</button>
            <button id="btn-basketball" onclick="logic.filterSport('basketball')" class="sport-tab">🏀 כדורסל</button>
        </div>

        <div id="quick-alerts" class="alerts-container"></div>

        <div class="stats-strip">
            <div class="stat-card">
                <span class="label">🎯 דיוק מודל AI</span>
                <span class="value">81.4%</span>
            </div>
            <div class="stat-card">
                <span class="label">📊 אירועים בבדיקה</span>
                <span id="active-events" class="value">0</span>
            </div>
            <div class="stat-card">
                <span class="label">📈 מומנטום ליגה</span>
                <span id="league-momentum" class="value" style="color:var(--green)">חיובי</span>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-header">
                    <h3>🏟️ לוח משחקים והסתברויות</h3>
                    <button class="refresh-btn" onclick="app.loadData()">🔄 רענן</button>
                </div>
                <div id="matches-container"></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3>🔍 ניתוח מעמיק וגרפים</h3>
                </div>
                <div id="detail-view">
                    <div id="analysis-content" style="display:none;">
                        <div class="chart-container">
                            <canvas id="matchChart"></canvas>
                        </div>
                        <div class="micro-stats" id="micro-stats-content"></div>
                    </div>
                    <p id="placeholder-text" class="muted">בחר משחק כדי לנתח נתונים מתקדמים</p>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
