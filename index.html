<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportIQ Ultra — Live Feed</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Heebo:wght@100;400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body onload="app.init()">

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area"><div class="logo">S<span>IQ</span></div></div>
            <nav class="side-nav">
                <button onclick="ui.showSection('dashboard')" class="nav-item active">📊</button>
                <button onclick="ui.showSection('live')" class="nav-item">📡</button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="search-box"><input type="text" placeholder="חיפוש ליגה..."></div>
                <div class="user-status">
                    <span id="api-status" class="api-badge">CONNECTING...</span>
                </div>
            </header>

            <section id="dashboard" class="content-page active">
                <div class="welcome-header">
                    <h1>משחקי <span>היום</span></h1>
                    <div class="filter-pills">
                        <button id="btn-soccer" class="pill active">Soccer (Live API)</button>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="list-panel">
                        <div class="panel-head">
                            <h3>לוח שידורים חי</h3>
                            <button class="sync-btn" onclick="app.fetchLiveSoccer()">SYNC LIVE</button>
                        </div>
                        <div id="matches-container" class="scroll-list">
                            <p class="muted">ממתין לסנכרון נתונים...</p>
                        </div>
                    </div>

                    <div class="analysis-panel">
                        <div id="analysis-content" class="glass-card" style="display:none;">
                            <div class="card-header">
                                <h2 id="selected-match-title">בחר משחק</h2>
                                <span id="match-status" class="ai-label">LIVE</span>
                            </div>
                            <div class="stats-viz">
                                <div class="chart-wrapper"><canvas id="matchChart"></canvas></div>
                                <div class="stats-summary" id="micro-stats-content"></div>
                            </div>
                        </div>
                        <div id="placeholder-text" class="empty-state">
                            <div class="icon">📡</div>
                            <p>לחץ על SYNC כדי למשוך משחקים חיים מהעולם</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
